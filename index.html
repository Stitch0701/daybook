<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#fafaf9; --surface:#ffffff; --line:#e7e5e4; --text:#1c1917; --muted:#78716c;
  --on:#fff; --accent:#4a6fa5; --accent-soft:#e8eef6; --warn:#a16207; --warn-soft:#fef7e0; --danger:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --on:#10161f; --bg:#141413; --surface:#1c1b1a; --line:#2e2c2a; --text:#f0eeec; --muted:#a8a29e;
    --accent:#8fb0e0; --accent-soft:#232c3a; --warn:#e5b94e; --warn-soft:#2c2616; --danger:#f08a8a;
  }
}
:root[data-theme="dark"]{
  --on:#10161f; --bg:#141413; --surface:#1c1b1a; --line:#2e2c2a; --text:#f0eeec; --muted:#a8a29e;
  --accent:#8fb0e0; --accent-soft:#232c3a; --warn:#e5b94e; --warn-soft:#2c2616; --danger:#f08a8a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.date-nav{display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.date-title{font-size:18px;font-weight:600;background:none;border:0;padding:4px 6px;position:relative}
.date-title small{display:block;font-size:12px;font-weight:400;color:var(--muted);text-align:left}
.date-title input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.link{background:none;border:0;color:var(--accent);padding:4px 6px;font-size:13px}
.tabs{display:flex;gap:2px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;color:var(--muted);font-weight:500}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding-top:16px}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner b{color:var(--warn)}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:7px 12px;font-weight:500}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
section.card h2{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.row .body{flex:1;min-width:0;cursor:pointer}
.row.done .txt{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.chip.t{color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
form.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
form.add input[type=text]{flex:1 1 150px;min-width:0}
input[type=text],input[type=time],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
form.add .extra{display:none;flex:1 0 100%;gap:6px}
form.add.open .extra{display:flex}
form.add .extra input,form.add .extra select{flex:1;width:auto}
form.add .more{border:1px solid var(--line);padding:6px 10px;font-size:15px}
form.add.open .more{background:var(--accent-soft);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--text)}
.plan-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.plan-chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.plan-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.group-title{display:flex;justify-content:space-between;align-items:baseline}
.sub{color:var(--muted);font-size:13px}
.day-label{font-size:12px;color:var(--muted);width:56px;flex:none;padding-top:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 12px;font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .sp{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.2)}
ol.steps{padding-left:18px;margin:6px 0}
code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:13px}
.carry-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:flex-start}
.field label.carry-row,label.carry-row{display:flex;font-size:inherit;color:var(--text);margin:0}
.carry-row input{margin-top:4px;flex:none}
#ptAdd select{width:auto}
.chip.pri-high{color:var(--danger);border-color:var(--danger)}
.chip.pri-med{color:var(--warn);border-color:var(--warn)}
.subs{margin-top:4px}
.sub-row{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:14px;color:var(--muted);cursor:pointer}
.sub-row input{width:15px;height:15px;accent-color:var(--accent)}
.sub-row.done span{text-decoration:line-through}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent)}
.stat-row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.stat-row .lbl{width:64px;color:var(--muted)}
.stat-row .num{width:44px;text-align:right;color:var(--muted)}
.big{font-size:28px;font-weight:600;line-height:1.1}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--muted)}
.days7 .d{border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--bg)}
.days7 .d.full{border-color:var(--accent);color:var(--text)}
.days7 .d b{display:block;font-weight:600;color:var(--text);font-size:13px}
textarea.rev{min-height:64px;resize:vertical}
mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.hit{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.hit .hb{flex:1;min-width:0;cursor:pointer}
.hit.done .ht{text-decoration:line-through;color:var(--muted)}
.hit .link{flex:none}
.search-box{position:sticky;top:-16px;background:var(--surface);padding:0 0 8px;z-index:1}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="top">
      <div class="date-nav">
        <button class="icon-btn" data-act="prev" aria-label="Previous day">‹</button>
        <div class="date-title" id="dateTitle"></div>
        <button class="icon-btn" data-act="next" aria-label="Next day">›</button>
        <button class="link" data-act="today" id="todayBtn">Today</button>
      </div>
      <div style="display:flex;gap:2px">
        <button class="icon-btn" data-act="search" aria-label="Search" title="Search (press /)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="themeBtn" data-act="theme"></button>
        <button class="icon-btn" data-act="settings" aria-label="Settings">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(function(){
  'use strict';

  // ---------- config ----------
  var KEY = 'daybook2';
  var TABS = [['overview','Overview'],['personal','Personal'],['work','Work'],['both','Both'],['review','Review']];
  var SECTIONS = {
    personal: [
      {id:'goals',    label:'Personal goals',   persist:true, ph:'Add a goal'},
      {id:'tasks',    label:'Personal tasks',   ph:'Add a task'},
      {id:'chores',   label:'House chores',     ph:'Add a chore'},
      {id:'meals',    label:'Food / meal prep', ph:'Add a meal or prep item'},
      {id:'groceries',label:'Groceries to get', persist:true, ph:'Add an item'},
      {id:'workout',  label:'Workout plan',     special:true}
    ],
    work: [
      {id:'tasks',    label:'Work tasks',        ph:'Add a task'},
      {id:'meetings', label:'Meetings',          ph:'Add a meeting'},
      {id:'followups',label:'Follow-ups',        ph:'Add a follow-up'}
    ],
    both: [
      {id:'tasks',    label:'Shared tasks',          ph:'Add a task'},
      {id:'events',   label:'Events & appointments', ph:'Add an event'}
    ]
  };
  var SCOPE_LABEL = {work:'Work', personal:'Personal', both:'Both'};
  var REMIND = [['','No reminder'],['0','At time'],['10','10 min before'],['30','30 min before'],['60','1 hour before'],['1440','1 day before']];
  var PRI = [['','No priority'],['med','Medium'],['high','High']];
  var PRI_RANK = {high:2,med:1};
  var REPEAT = [['','Does not repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week']];
  var DEFAULT_PLANS = {
    W1:{name:'Push', ex:['Bench press 3×8','Overhead press 3×8','Incline dumbbell press 3×10','Triceps dips 3×10','Plank 3×45s']},
    W2:{name:'Pull', ex:['Pull-ups 3×8','Barbell row 3×8','Lat pulldown 3×10','Biceps curl 3×12','Face pulls 3×15']},
    W3:{name:'Legs', ex:['Squat 4×8','Romanian deadlift 3×8','Lunges 3×10 each','Calf raises 3×15','Core circuit 10 min']}
  };

  // ---------- state ----------
  var state = load();
  function load(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
    s = s || {};
    s.items = s.items || [];
    s.recurring = s.recurring || [];
    s.plans = s.plans || JSON.parse(JSON.stringify(DEFAULT_PLANS));
    s.wdays = s.wdays || {};
    s.fired = s.fired || {};
    s.reviews = s.reviews || {};
    s.planned = s.planned || {};
    s.planSkip = s.planSkip || '';
    if(s.eveningHour==null) s.eveningHour = 20;
    s.theme = s.theme || '';
    return s;
  }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function save(){ persist(); scheduleBackup(); }

  // ---------- dates ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseYmd(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function todayStr(){ return ymd(new Date()); }
  function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
  function fmtTime(t){ if(!t) return ''; var p=t.split(':'),h=+p[0]; return ((h%12)||12)+':'+p[1]+' '+(h<12?'AM':'PM'); }
  function longDate(s){ return parseYmd(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
  function shortDate(s){ return parseYmd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var ui = {tab:'overview', date:todayStr(), followToday:true, range:'day'};

  // ---------- section helpers ----------
  function secDef(scope,id){ return (SECTIONS[scope]||[]).filter(function(s){return s.id===id;})[0]; }
  function isPersist(it){ var d=secDef(it.scope,it.sec); return !!(d&&d.persist); }
  function live(){ return state.items.filter(function(i){return !i.gone;}); }
  function itemsFor(scope,sec,date){
    var persist = secDef(scope,sec).persist;
    return live().filter(function(i){
      return i.scope===scope && i.sec===sec && (persist || i.date===date);
    }).sort(cmpItems);
  }
  function cmpItems(a,b){
    if(!!a.done!==!!b.done) return a.done?1:-1;
    if(a.date!==b.date) return (a.date||'')<(b.date||'')?-1:1;
    var pa=PRI_RANK[a.pri]||0, pb=PRI_RANK[b.pri]||0;
    if(pa!==pb) return pb-pa;
    var ta=a.time||'99:99', tb=b.time||'99:99';
    return ta<tb?-1:ta>tb?1:0;
  }

  // ---------- recurring ----------
  function matches(r,date){
    if(date<r.start) return false;
    var dow=parseYmd(date).getDay();
    if(r.repeat==='daily') return true;
    if(r.repeat==='weekdays') return dow>0&&dow<6;
    if(r.repeat==='weekly') return dow===parseYmd(r.start).getDay();
    return false;
  }
  function ensureRecurring(date){
    var changed=false;
    state.recurring.forEach(function(r){
      if(!matches(r,date)) return;
      var has = state.items.some(function(i){return i.rid===r.id && i.date===date;});
      if(has) return;
      state.items.push({id:uid(),scope:r.scope,sec:r.sec,text:r.text,date:date,time:r.time,remind:r.remind,pri:r.pri||'',subs:(r.subs||[]).map(function(x){return {id:uid(),text:x,done:false};}),done:false,rid:r.id,
        handled: date<todayStr()});
      changed=true;
    });
    if(changed) save();
  }

  // ---------- carry forward (always asks) ----------
  function overdue(){
    var t=todayStr();
    return live().filter(function(i){
      return i.date && i.date<t && !i.done && !i.handled && !i.rid && !isPersist(i);
    }).sort(cmpItems);
  }

  // ---------- reminders ----------
  function fireAt(it){
    if(!it.date || it.remind==null || it.remind==='' || it.done || it.gone) return null;
    var p=(it.time||'09:00').split(':'), d=parseYmd(it.date);
    d.setHours(+p[0],+p[1],0,0);
    if(it.time) d.setMinutes(d.getMinutes()-(+it.remind||0));
    return d;
  }
  function checkReminders(){
    var now=new Date(), changed=false;
    live().forEach(function(it){
      var f=fireAt(it); if(!f) return;
      var key=it.id+'|'+it.date+'|'+it.time+'|'+it.remind;
      var age=now-f;
      if(age>=0 && age<3*3600*1000 && !state.fired[key]){
        state.fired[key]=Date.now(); changed=true;
        var msg=(it.time?fmtTime(it.time)+' · ':'')+it.text;
        toast('🔔 '+msg);
        try { if(window.Notification && Notification.permission==='granted') new Notification('Daybook',{body:msg}); } catch(e){}
      }
    });
    var cutoff=Date.now()-3*86400000;
    Object.keys(state.fired).forEach(function(k){ if(state.fired[k]<cutoff){delete state.fired[k];changed=true;} });
    if(changed) save();
  }
  function toast(msg){
    var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function(){ el.remove(); }, 6000);
    el.addEventListener('click',function(){ el.remove(); });
  }

  // ---------- Apple Calendar / Reminders ----------
  function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function icsDT(date,time,addMin){
    var p=(time||'00:00').split(':'), d=parseYmd(date); d.setHours(+p[0],+p[1]+(addMin||0),0,0);
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  }
  function buildIcs(items){
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daybook//EN','CALSCALE:GREGORIAN'];
    var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    items.forEach(function(it){
      L.push('BEGIN:VEVENT','UID:'+it.id+'-'+it.date+'@daybook','DTSTAMP:'+stamp,'SUMMARY:'+icsEsc(it.text),
        'CATEGORIES:'+SCOPE_LABEL[it.scope]);
      if(it.pri) L.push('PRIORITY:'+(it.pri==='high'?1:5));
      if((it.subs||[]).length) L.push('DESCRIPTION:'+icsEsc(it.subs.map(function(x){return (x.done?'[x] ':'[ ] ')+x.text;}).join('\n')));
      if(it.time){ L.push('DTSTART:'+icsDT(it.date,it.time,0),'DTEND:'+icsDT(it.date,it.time,60)); }
      else { L.push('DTSTART;VALUE=DATE:'+it.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(it.date,1).replace(/-/g,'')); }
      if(it.remind!=null && it.remind!==''){
        L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.text),
          'TRIGGER:'+(it.time ? '-PT'+(+it.remind)+'M' : 'PT9H'),'END:VALARM');
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function download(name,mime,text){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:mime}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }
  function exportIcs(items,name){
    items=items.filter(function(i){return i.date;});
    if(!items.length){ toast('Nothing dated to export'); return; }
    download(name,'text/calendar',buildIcs(items));
  }
  function sendToReminders(items){
    items=items.filter(function(i){return i.date && !i.done;});
    if(!items.length){ toast('Nothing to send'); return; }
    var payload=JSON.stringify(items.map(function(i){
      return {title:i.text,date:i.date,time:i.time||'',list:SCOPE_LABEL[i.scope],priority:i.pri||'',subtasks:(i.subs||[]).map(function(x){return x.text;})};
    }));
    window.location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Daybook to Reminders')+
      '&input=text&text='+encodeURIComponent(payload);
  }
  function itemsOnDay(date){ return live().filter(function(i){return i.date===date && !isPersist(i);}); }

  // ---------- rendering ----------
  function render(){
    ensureRecurring(ui.date);
    var t=todayStr();
    document.getElementById('dateTitle').innerHTML =
      '<small>'+(ui.date===t?'Today':ui.date<t?'Past':'Upcoming')+'</small>'+esc(shortDate(ui.date))+
      '<input type="date" id="datePick" value="'+ui.date+'">';
    document.getElementById('todayBtn').style.display = ui.date===t?'none':'';
    document.getElementById('tabs').innerHTML = TABS.map(function(x){
      return '<button class="tab'+(ui.tab===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>';
    }).join('');
    var h = planBanner() + carryBanner() + (ui.tab==='overview' ? renderOverview() : ui.tab==='review' ? renderReview() : renderScope(ui.tab));
    document.getElementById('app').innerHTML = h;
  }

  // ---------- evening planning ----------
  function tomorrowStr(){ return addDays(todayStr(),1); }
  function eveningDue(){
    var h=state.eveningHour;
    if(h==null || h<0) return false;
    return new Date().getHours()>=h && !state.planned[tomorrowStr()] && state.planSkip!==todayStr();
  }
  function planBanner(){
    if(ui.date!==todayStr() || !eveningDue()) return '';
    return '<div class="banner" style="background:var(--accent-soft)"><span><b style="color:var(--accent)">Plan tomorrow</b> · take a minute to set up '+esc(shortDate(tomorrowStr()))+'.</span>'+
      '<button class="btn" data-act="plan">Plan</button></div>';
  }

  function carryBanner(){
    var n=overdue().length;
    if(!n) return '';

  // ---------- weekly review ----------
  function weekStart(date){ var d=parseYmd(date); return addDays(date,-((d.getDay()+6)%7)); }
  function bar(done,total){ return '<div class="bar"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>'; }
  function renderReview(){
    var ws=weekStart(ui.date), we=addDays(ws,6), t=todayStr(), i;
    for(i=0;i<14;i++){ var dd=addDays(ws,i); if(dd>=t) ensureRecurring(dd); }
    var inWeek=function(a,b){ return live().filter(function(x){return x.date && x.date>=a && x.date<=b && !isPersist(x);}); };
    var its=inWeek(ws,we), done=its.filter(function(x){return x.done;}).length;
    var rv=state.reviews[ws]||{}, prev=state.reviews[addDays(ws,-7)]||{};
    var rng=shortDate(ws).replace(/^\w+, /,'')+' – '+shortDate(we).replace(/^\w+, /,'');
    var h='<div class="week-nav"><button class="icon-btn" data-act="wk-prev" aria-label="Previous week">‹</button>'+
      '<div style="text-align:center"><div style="font-weight:600">'+esc(rng)+'</div><div class="sub">'+(ws<=t&&t<=we?'This week':we<t?'Past week':'Upcoming week')+'</div></div>'+
      '<button class="icon-btn" data-act="wk-next" aria-label="Next week">›</button></div>';

    // summary
    h+='<section class="card"><h2><span>Completed</span></h2>'+
      (its.length ? '<div class="big">'+done+' of '+its.length+' <span class="sub">('+Math.round(done/its.length*100)+'%)</span></div>' : '<div class="empty">No dated items this week.</div>');
    ['work','personal','both'].forEach(function(sc){
      var g=its.filter(function(x){return x.scope===sc;}), gd=g.filter(function(x){return x.done;}).length;
      if(g.length) h+='<div class="stat-row"><span class="lbl">'+SCOPE_LABEL[sc]+'</span>'+bar(gd,g.length)+'<span class="num">'+gd+'/'+g.length+'</span></div>';
    });
    var hi=its.filter(function(x){return x.pri==='high';});
    if(hi.length) h+='<div class="stat-row"><span class="lbl">⚑ High</span>'+bar(hi.filter(function(x){return x.done;}).length,hi.length)+'<span class="num">'+hi.filter(function(x){return x.done;}).length+'/'+hi.length+'</span></div>';
    h+='</section>';

    // day strip + workouts
    var planned=0, finished=0, cells='';
    for(i=0;i<7;i++){
      var d=addDays(ws,i), di=its.filter(function(x){return x.date===d;}), dn=di.filter(function(x){return x.done;}).length;
      var wd=state.wdays[d], wl='';
      if(wd && wd.plan && state.plans[wd.plan]){
        var n=state.plans[wd.plan].ex.length, c=Object.keys(wd.done||{}).filter(function(k){return wd.done[k];}).length;
        planned++; if(n&&c>=n) finished++;
        wl='<br>'+wd.plan+' '+c+'/'+n;
      }
      cells+='<div class="d'+(di.length&&dn===di.length?' full':'')+'"><b>'+parseYmd(d).toLocaleDateString(undefined,{weekday:'narrow'})+'</b>'+(di.length?dn+'/'+di.length:'–')+wl+'</div>';
    }
    h+='<section class="card"><h2><span>Day by day</span></h2><div class="days7">'+cells+'</div>'+
      '<div class="sub" style="margin-top:8px">'+(planned?'Workouts finished: '+finished+' of '+planned+' planned.':'No workouts planned this week.')+'</div></section>';

    // unfinished
    var open=its.filter(function(x){return !x.done && !x.rid && x.date<t;}).sort(cmpItems);
    if(open.length){
      h+='<section class="card"><h2><span>Didn’t get done</span></h2>'+open.map(function(x){
        return '<label class="carry-row"><input type="checkbox" data-wk="'+x.id+'" checked><span><div>'+esc(x.text)+'</div><div class="sub">'+SCOPE_LABEL[x.scope]+' · '+esc(shortDate(x.date))+'</div></span></label>';
      }).join('')+'<div class="actions"><button class="btn" data-act="wk-move">Move selected to today</button></div></section>';
    }

    // reflection
    h+='<section class="card"><h2><span>Reflect</span></h2>'+
      (prev.focus?'<div class="banner" style="margin-bottom:10px"><span><b>Last week’s focus:</b> '+esc(prev.focus)+'</span></div>':'')+
      [['wins','What went well?'],['issues','What got in the way?'],['focus','Focus for next week']].map(function(f){
        return '<div class="field"><label>'+f[1]+'</label><textarea class="rev" data-rev="'+f[0]+'" data-week="'+ws+'">'+esc(rv[f[0]]||'')+'</textarea></div>';
      }).join('')+'</section>';

    // next week
    var nx=inWeek(addDays(we,1),addDays(we,7)).filter(function(x){return !x.done;}).sort(function(a,b){
      var pa=PRI_RANK[a.pri]||0, pb=PRI_RANK[b.pri]||0; if(pa!==pb) return pb-pa; return a.date<b.date?-1:a.date>b.date?1:0; });
    h+='<section class="card"><h2><span>Next week</span><span style="font-weight:400">'+nx.length+' planned</span></h2>'+
      (nx.length ? nx.slice(0,6).map(function(x){return rowHtml(x,true);}).join('')+(nx.length>6?'<div class="empty">+ '+(nx.length-6)+' more</div>':'') : '<div class="empty">Nothing planned yet.</div>')+'</section>';
    return h;
  }

  function hl(text,terms){
    if(!terms.length) return esc(text);
    var re=new RegExp('('+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','gi');
    return text.split(re).map(function(part,i){ return i%2 ? '<mark>'+esc(part)+'</mark>' : esc(part); }).join('');
  }
  function secLabel(it){ var d=secDef(it.scope,it.sec); return d?d.label:''; }
  function renderSearch(q){
    var box=document.getElementById('searchResults'); if(!box) return;
    var terms=q.toLowerCase().split(/\s+/).filter(Boolean);
    if(!terms.length){ box.innerHTML='<div class="empty">Type to search every item, including past and future days, subtasks, and areas like “work” or “groceries”.</div>'; return; }
    var t=todayStr();
    var hits=live().filter(function(it){
      var hay=[it.text,(it.subs||[]).map(function(x){return x.text;}).join(' '),SCOPE_LABEL[it.scope],secLabel(it),
        it.pri==='high'?'high priority':it.pri==='med'?'medium priority':'', it.date?shortDate(it.date)+' '+it.date:''].join(' ').toLowerCase();
      return terms.every(function(w){return hay.indexOf(w)>=0;});
    });
    var dist=function(it){ return it.date ? Math.abs(parseYmd(it.date)-parseYmd(t)) : 0; };
    hits.sort(function(a,b){ if(!!a.done!==!!b.done) return a.done?1:-1; return dist(a)-dist(b); });
    if(!hits.length){ box.innerHTML='<div class="empty">No matches.</div>'; return; }
    box.innerHTML='<div class="sub" style="margin-bottom:2px">'+hits.length+(hits.length===1?' match':' matches')+(hits.length>40?' (showing 40)':'')+'</div>'+
      hits.slice(0,40).map(function(it){
        var subHit=(it.subs||[]).filter(function(x){return terms.some(function(w){return x.text.toLowerCase().indexOf(w)>=0;});})[0];
        var meta=SCOPE_LABEL[it.scope]+' · '+secLabel(it)+(it.date?' · '+(it.date===t?'Today':shortDate(it.date)):'')+(it.time?' · '+fmtTime(it.time):'');
        return '<div class="hit'+(it.done?' done':'')+'"><div class="hb" data-hit="'+it.id+'"><div class="ht">'+(it.pri?'⚑ ':'')+hl(it.text,terms)+'</div>'+

          '<button class="link" data-hit-edit="'+it.id+'">Edit</button></div>';
      }).join('');
  }

  function loadGis(cb){
    if(window.google && google.accounts && google.accounts.oauth2) return cb();

  // interactive=true must be called from a tap (popup); false tries silently.
  function getToken(interactive){
    return new Promise(function(resolve,reject){
      if(tokenValid()) return resolve(driveToken);
      loadGis(function(err){
        if(err) return reject(err);
        var tc=google.accounts.oauth2.initTokenClient({
          client_id:GOOGLE_CLIENT_ID, scope:DRIVE_SCOPE,
          callback:function(r){
            if(r.error) return reject(new Error(r.error));
            driveToken=r.access_token; driveExpiry=Date.now()+(+r.expires_in||3600)*1000; resolve(driveToken);
          },
          error_callback:function(e){ reject(new Error((e&&e.type)||'sign-in cancelled')); }
        });
        tc.requestAccessToken({prompt: interactive ? '' : 'none'});
      });
    });
  }
  function gfetch(url,opts,interactive){
    return getToken(interactive).then(function(tok){
      opts=opts||{}; opts.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
      return fetch(url,opts);
    }).then(function(r){
      if(r.status===401){ driveToken=null; throw new Error('Google session expired. Reconnect to continue.'); }
      if(!r.ok) throw new Error('Google Drive error ('+r.status+')');
      return r;
    });
  }
  function findBackup(interactive){
    var d=drv();
    var byName=function(){
      var q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
      return gfetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&orderBy=modifiedTime desc',{},interactive)
        .then(function(r){return r.json();}).then(function(j){ return (j.files&&j.files[0])||null; });
    };
    if(!d.fileId) return byName();
    return gfetch('https://www.googleapis.com/drive/v3/files/'+d.fileId+'?fields=id,modifiedTime,trashed',{},interactive)
      .then(function(r){return r.json();}).then(function(f){ return f.trashed?byName():f; })
      .catch(function(e){ if(/\(404\)/.test(e.message)) return byName(); throw e; });
  }
  function backupPayload(){ var c=Object.assign({},state); delete c.drive; return JSON.stringify(c); }

  function backupNow(interactive){
    return findBackup(interactive).then(function(f){
      var body, url, method;
      if(f){
        drv().fileId=f.id; method='PATCH'; url='https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media&fields=id,modifiedTime';
        return gfetch(url,{method:method,headers:{'Content-Type':'application/json'},body:backupPayload()},interactive);
      }
      var b='daybookboundary'+Date.now();
      body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'})+
        '\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+backupPayload()+'\r\n--'+b+'--';
      return gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',
        {method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body},interactive);
    }).then(function(r){return r.json();}).then(function(j){
      var d=drv(); d.fileId=j.id; d.lastBackup=new Date().toISOString(); d.synced=true; persist();
    });
  }
  function scheduleBackup(){
    var d=state.drive;
    if(!d || !d.connected || d.auto===false || !d.synced || !tokenValid()) return;
    clearTimeout(driveTimer);
    driveTimer=setTimeout(function(){ backupNow(false).catch(function(){}); },15000);
  }

  function driveHtml(){
    var d=drv(), h='<div class="field"><label>Google Drive backup</label>';
    if(!d.connected){
      return h+'<button class="btn ghost" data-act="drive-connect">Connect Google Drive</button>'+
        '<div class="sub" style="margin-top:4px">Saves one file, <code>'+DRIVE_FILE+'</code>, to your Drive. Daybook can only see files it creates itself.</div></div>';
    }
    h+='<div class="sub" style="margin-bottom:6px">'+(tokenValid()?'Connected':'Signed out. Tap Reconnect to continue.')+
      (d.lastBackup?' · Last backup '+esc(new Date(d.lastBackup).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})):' · No backup yet')+'</div>'+
      '<div class="actions" style="margin-top:0">'+
      (tokenValid()?'':'<button class="btn" data-act="drive-connect">Reconnect</button>')+
      '<button class="btn ghost" data-act="drive-backup">Back up now</button>'+
      '<button class="btn ghost" data-act="drive-restore">Restore</button>'+
      '<button class="btn danger" data-act="drive-disconnect">Disconnect</button></div>'+
      '<label class="sub" style="display:flex;gap:6px;margin-top:8px;align-items:center"><input type="checkbox" id="driveAuto"'+(d.auto===false?'':' checked')+'> Back up automatically while Daybook is open and signed in</label></div>';
    return h;
  }
  function driveRun(label,fn){
    if(driveBusy) return; driveBusy=true; toast(label+'…');
    fn().then(function(msg){ if(msg) toast(msg); }).catch(function(e){ toast('⚠ '+(e&&e.message||'Something went wrong')); })
      .then(function(){ driveBusy=false; if(document.getElementById('themeSel')) openSettings(); });
  }
  function driveConnect(){
    driveRun('Connecting',function(){
      return getToken(true).then(function(){
        var d=drv(); d.connected=true; if(d.auto==null) d.auto=true; persist();
        return findBackup(true).then(function(f){
          if(f){ d.fileId=f.id; if(!d.lastBackup) d.synced=false; persist(); return d.synced===false ? 'Connected. A backup already exists: choose Restore to load it, or Back up now to overwrite it.' : 'Connected'; }
          d.synced=true; persist(); return backupNow(true).then(function(){ return 'Connected and backed up'; });
        });
      });
    });
  }
  function driveBackupClick(){
    var d=drv();
    if(d.synced===false && !confirm('A backup already exists in your Google Drive. Overwrite it with the data on this device?')) return;
    driveRun('Backing up',function(){ return backupNow(true).then(function(){ return 'Backed up to Google Drive'; }); });
  }
  function driveRestoreClick(){
    driveRun('Looking for backup',function(){
      return findBackup(true).then(function(f){
        if(!f) throw new Error('No backup found in Google Drive yet.');
        return gfetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{},true).then(function(r){return r.json();}).then(function(data){
          if(!data || !Array.isArray(data.items)) throw new Error('That file is not a Daybook backup.');
          var when=f.modifiedTime?new Date(f.modifiedTime).toLocaleString():'unknown time';
          if(!confirm('Replace the data on this device with the Drive backup from '+when+' ('+data.items.length+' items)? Export first if unsure.')) return 'Restore cancelled';
          var keep=state.drive; delete data.drive;
          localStorage.setItem(KEY,JSON.stringify(data)); state=load(); state.drive=keep; state.drive.fileId=f.id; state.drive.synced=true; persist();
          applyTheme(); render(); return 'Restored from Google Drive';
        });
      });
    });
  }
  function driveDisconnect(){
    if(!confirm('Disconnect Google Drive? The backup file stays in your Drive.')) return;
    var tok=driveToken; driveToken=null; driveExpiry=0; clearTimeout(driveTimer);
    try { if(tok && window.google && google.accounts) google.accounts.oauth2.revoke(tok,function(){}); } catch(e){}
    state.drive={}; persist(); openSettings();
  }

  function openSettings(){
    var perm = window.Notification ? Notification.permission : 'unsupported';
    openModal('<h3>Settings</h3>'+
      '<div class="field"><label>Theme</label><select id="themeSel">'+optionsHtml([['','Match device'],['light','Light'],['dark','Dark']],state.theme)+'</select></div>'+
      '<div class="field"><label>Evening prompt to plan tomorrow</label><select id="eveSel">'+optionsHtml([['-1','Off'],['18','6 PM'],['19','7 PM'],['20','8 PM'],['21','9 PM'],['22','10 PM']],String(state.eveningHour))+'</select></div>'+
      '<div class="field"><label>Reminder alerts (while Daybook is open)</label>'+
        '<button class="btn ghost" data-act="notif">'+(perm==='granted'?'Enabled':perm==='denied'?'Blocked in browser settings':'Enable notifications')+'</button></div>'+
      '<div class="field"><label>Apple Calendar</label><div class="sub">Use <b>Add to Apple Calendar</b> on the Overview page (whole day) or "Calendar" inside any item. It downloads an .ics file; open it to add the events with their reminders.</div></div>'+
      '<div class="field"><label>Apple Reminders (one-time Shortcut setup)</label>'+
        '<ol class="steps sub"><li>Open the <b>Shortcuts</b> app → new shortcut named <code>Daybook to Reminders</code>.</li>'+
        '<li>Add <b>Get Dictionary from Input</b> (the input is a list of items).</li>'+
        '<li>Add <b>Repeat with Each</b> over it. Inside, add <b>Get Dictionary Value</b> for <code>title</code>, <code>date</code>, <code>time</code>.</li>'+
        '<li>Add <b>Add New Reminder</b> with the title, and set its due date from the date and time values.</li></ol>'+
        '<div class="sub">Then <b>Send to Reminders</b> on the Overview or inside an item runs it. iPhone and Mac only.</div></div>'+
      '<div class="field"><label>Backup</label><div class="actions" style="margin-top:0">'+
        '<button class="btn ghost" data-act="backup">Export data</button>'+
        '<label class="btn ghost" style="cursor:pointer">Import data<input type="file" id="importFile" accept="application/json" hidden></label></div>'+
        '<div class="sub" style="margin-top:4px">Data is stored on this device. Export a file, or back up to Google Drive below.</div></div>'+
      driveHtml()+
      '<div class="actions"><button class="btn" data-close="1">Done</button></div>');
  }

  // ---------- parse helpers ----------
  function extractTime(text){
    var m=text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if(m){
      var h=+m[1]%12; if(/pm/i.test(m[3])) h+=12;
      return {text:text.replace(m[0],'').replace(/\s{2,}/g,' ').trim(), time:pad(h)+':'+(m[2]||'00')};
    }
    m=text.match(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(m) return {text:text.replace(m[0],'').replace(/\s{2,}/g,' ').trim(), time:pad(+m[1])+':'+m[2]};
    return {text:text.trim(), time:''};
  }

  // ---------- events ----------
  var darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark(){ return state.theme ? state.theme==='dark' : !!(darkMq && darkMq.matches); }
  function applyTheme(){
    if(state.theme) document.documentElement.setAttribute('data-theme',state.theme);
    else document.documentElement.removeAttribute('data-theme');
    var b=document.getElementById('themeBtn');
    if(b){ b.textContent=isDark()?'☀':'☾'; b.setAttribute('aria-label',isDark()?'Switch to light mode':'Switch to dark mode'); b.title=b.getAttribute('aria-label'); }
  }
  if(darkMq && darkMq.addEventListener) darkMq.addEventListener('change',applyTheme);
  function findItem(id){ return state.items.filter(function(i){return i.id===id;})[0]; }

  document.addEventListener('click',function(e){
    var t=e.target, el;
    if(t.closest('[data-subrow]')) return;
    if((el=t.closest('[data-hit-edit]'))){ openEdit(el.getAttribute('data-hit-edit')); return; }
    if((el=t.closest('[data-hit]'))){
      var hit=findItem(el.getAttribute('data-hit'));
      if(hit){ ui.tab=hit.scope; if(hit.date){ ui.date=hit.date; ui.followToday=(hit.date===todayStr()); } closeModal(); render(); window.scrollTo(0,0); }
      return;
    }
    if((el=t.closest('[data-tab]'))){ ui.tab=el.getAttribute('data-tab'); render(); return; }
    if((el=t.closest('[data-more]'))){ el.closest('form').classList.toggle('open'); return; }
    if((el=t.closest('[data-range]'))){ ui.range=el.getAttribute('data-range'); render(); return; }
    if((el=t.closest('[data-goto]'))){ ui.tab=el.getAttribute('data-goto'); render(); return; }
    if((el=t.closest('[data-edit]'))){ openEdit(el.getAttribute('data-edit')); return; }
    if((el=t.closest('[data-plan]'))){
      state.wdays[ui.date]={plan:el.getAttribute('data-plan'),done:{}}; save(); render(); return;
    }
    if((el=t.closest('[data-wex-row]'))){
      var wd=state.wdays[ui.date]; if(wd){ wd.done=wd.done||{}; var k=el.getAttribute('data-wex-row'); wd.done[k]=!wd.done[k]; save(); render(); } return;
    }
    if(t.closest('[data-clear]')){
      state.items=state.items.filter(function(i){return !(i.sec==='groceries'&&i.done);}); save(); render(); return;
    }
    if((el=t.closest('[data-del]'))){
      var it=findItem(el.getAttribute('data-del')); if(it){ if(it.rid) it.gone=true; else state.items=state.items.filter(function(i){return i!==it;}); save(); }
      closeModal(); render(); return;
    }
    if((el=t.closest('[data-item-ics]'))){ var a=findItem(el.getAttribute('data-item-ics')); if(a) exportIcs([a],'daybook-item.ics'); return; }
    if((el=t.closest('[data-item-rem]'))){ var b=findItem(el.getAttribute('data-item-rem')); if(b) sendToReminders([b]); return; }
    if(t.closest('[data-close]') || t.getAttribute('data-modal-bg')){ closeModal(); return; }
    if((el=t.closest('[data-act]'))){
      var act=el.getAttribute('data-act');
      if(act==='prev'||act==='next'){ ui.date=addDays(ui.date,act==='prev'?-1:1); ui.followToday=(ui.date===todayStr()); render(); }
      else if(act==='today'){ ui.date=todayStr(); ui.followToday=true; render(); }
      else if(act==='search') openSearch();
      else if(act==='theme'){ state.theme=isDark()?'light':'dark'; save(); applyTheme(); }
      else if(act==='carry') openCarry();
      else if(act==='plan'){ ui.ptOff=[]; openPlan(); }
      else if(act==='plan-skip'){ state.planSkip=todayStr(); save(); closeModal(); render(); }
      else if(act==='plan-done'){
        var tm=tomorrowStr(), moved=0;
        document.querySelectorAll('input[data-pt]:checked').forEach(function(c){
          var m=findItem(c.getAttribute('data-pt')); if(m){ m.date=tm; m.handled=false; moved++; }
        });
        var w=document.getElementById('ptWorkout').value;
        if(w) state.wdays[tm]={plan:w,done:(state.wdays[tm]&&state.wdays[tm].plan===w)?state.wdays[tm].done:{}};
        else if(state.wdays[tm]) state.wdays[tm]={plan:'',done:{}};
        state.planned[tm]=true; save(); closeModal(); render(); toast('Tomorrow is planned'+(moved?' · '+moved+' moved':''));
      }
      else if(act==='wk-prev'||act==='wk-next'){ ui.date=addDays(weekStart(ui.date),act==='wk-prev'?-7:7); ui.followToday=(ui.date===todayStr()); render(); }
      else if(act==='wk-move'){
        var tt=todayStr(), n=0;
        document.querySelectorAll('input[data-wk]:checked').forEach(function(c){
          var m=findItem(c.getAttribute('data-wk')); if(m){ m.date=tt; m.handled=false; n++; }
        });
        save(); render(); toast(n?'Moved to today':'Nothing selected');
      }
      else if(act==='plans') openPlans();
      else if(act==='settings') openSettings();
      else if(act==='ics-day') exportIcs(itemsOnDay(ui.date),'daybook-'+ui.date+'.ics');
      else if(act==='rem-day') sendToReminders(itemsOnDay(ui.date));
      else if(act==='notif'){
        if(window.Notification) Notification.requestPermission().then(openSettings); else toast('Notifications not supported here');
      }
      else if(act==='drive-connect') driveConnect();
      else if(act==='drive-backup') driveBackupClick();
      else if(act==='drive-restore') driveRestoreClick();
      else if(act==='drive-disconnect') driveDisconnect();
      else if(act==='backup') download('daybook-backup-'+todayStr()+'.json','application/json',JSON.stringify(state,null,2));
    }
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='searchInput') renderSearch(e.target.value);
  });
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='Escape' && document.getElementById('modalRoot').firstChild){ closeModal(); return; }
    var typing = tag==='input'||tag==='textarea'||tag==='select';
    if((e.key==='/' && !typing && !e.metaKey && !e.ctrlKey) || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
      e.preventDefault(); openSearch();
    }
  });

  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='datePick' && t.value){ ui.date=t.value; ui.followToday=(ui.date===todayStr()); render(); return; }
    if(t.hasAttribute('data-sub')){
      var ids=t.getAttribute('data-sub').split('|'), pit=findItem(ids[0]);
      if(pit){ (pit.subs||[]).forEach(function(x){ if(x.id===ids[1]) x.done=t.checked; }); save(); render(); } return;
    }
    if(t.hasAttribute('data-toggle')){
      var it=findItem(t.getAttribute('data-toggle')); if(it){ it.done=t.checked; save(); render(); } return;
    }
    if(t.hasAttribute('data-wex')){
      var wd=state.wdays[ui.date]; if(wd){ wd.done=wd.done||{}; wd.done[t.getAttribute('data-wex')]=t.checked; save(); render(); } return;
    }
    if(t.hasAttribute('data-rev')){
      var wk=t.getAttribute('data-week'); state.reviews[wk]=state.reviews[wk]||{}; state.reviews[wk][t.getAttribute('data-rev')]=t.value; save(); return;
    }
    if(t.hasAttribute('data-pt')){
      var id=t.getAttribute('data-pt'), arr=ui.ptOff||(ui.ptOff=[]), ix=arr.indexOf(id);
      if(t.checked && ix>=0) arr.splice(ix,1); else if(!t.checked && ix<0) arr.push(id);
      return;
    }
    if(t.id==='driveAuto'){ drv().auto=t.checked; persist(); return; }
    if(t.id==='eveSel'){ state.eveningHour=parseInt(t.value,10); save(); render(); return; }
    if(t.id==='themeSel'){ state.theme=t.value; save(); applyTheme(); return; }
    if(t.id==='importFile' && t.files[0]){
      var r=new FileReader();
      r.onload=function(){
        try {
          var d=JSON.parse(r.result);
          if(!d||!Array.isArray(d.items)) throw 0;
          var keepDrive=state.drive; delete d.drive; localStorage.setItem(KEY,JSON.stringify(d)); state=load(); state.drive=keepDrive||{}; persist(); applyTheme(); closeModal(); render(); toast('Imported');
        } catch(err){ toast('That file is not a Daybook backup'); }
      };
      r.readAsText(t.files[0]);
    }
  });

  document.addEventListener('submit',function(e){
    var f=e.target; e.preventDefault();
    if(f.hasAttribute('data-plan-form')){
      var v=f.querySelector('input').value.trim().toLowerCase(), m=v.match(/^w?([1-3])$/);
      if(m) state.wdays[ui.date]={plan:'W'+m[1],done:{}};
      else if(/^(rest|off|none|)$/.test(v)) state.wdays[ui.date]={plan:'',done:{}};
      else { toast('Use W1, W2 or W3'); return; }
      save(); render(); return;
    }
    if(f.id==='ptAdd'){
      var raw=f.querySelector('input').value.trim(); if(!raw) return;
      var txt=raw, pri='', bang=txt.match(/\s*(!{1,2})\s*$/);
      if(bang){ pri=bang[1].length>1?'high':'med'; txt=txt.slice(0,bang.index).trim()||txt; }
      var x=extractTime(txt);
      state.items.push({id:uid(),scope:f.querySelector('select').value,sec:'tasks',text:x.text||txt,date:tomorrowStr(),time:x.time,remind:'',pri:pri,subs:[],done:false});
      save(); openPlan(); render(); var ni=document.querySelector('#ptAdd input'); if(ni) ni.focus(); return;
    }
    if(f.classList.contains('add')){
      var scope=f.getAttribute('data-scope'), sec=f.getAttribute('data-sec'), persist=secDef(scope,sec).persist;
      var inp=f.querySelector('input[type=text]'), raw=inp.value.trim(); if(!raw) return;
      var time='', text=raw, pri='';
      var bang=text.match(/\s*(!{1,2})\s*$/);
      if(bang){ pri=bang[1].length>1?'high':'med'; text=text.slice(0,bang.index).trim()||text; }
      if(!persist){
        var tin=f.querySelector('input[type=time]').value;
        if(tin) time=tin; else { var x=extractTime(text); text=x.text||text; time=x.time; }
        pri=f.querySelector('select[data-pri]').value||pri;
      }
      var remind=persist?'':f.querySelector('select:not([data-pri])').value;
      state.items.push({id:uid(),scope:scope,sec:sec,text:text,date:persist?null:ui.date,time:time,remind:remind,pri:pri,subs:[],done:false});
      save(); render();
      var nf=document.querySelector('form.add[data-scope="'+scope+'"][data-sec="'+sec+'"] input[type=text]'); if(nf) nf.focus();
      return;
    }
    if(f.id==='editForm'){
      var it=findItem(f.getAttribute('data-id')); if(!it) return;
      var d=new FormData(f);
      it.text=(d.get('text')||'').trim()||it.text;
      it.pri=d.get('pri')||'';
      var old=it.subs||[];
      it.subs=(d.get('subs')||'').split('\n').map(function(x){return x.trim();}).filter(Boolean).map(function(txt){
        var m=old.filter(function(o){return o.text===txt;})[0];
        return m||{id:uid(),text:txt,done:false};
      });
      if(d.has('date')){
        it.date=d.get('date')||it.date; it.time=d.get('time')||''; it.remind=d.get('remind');
        var rep=d.get('repeat');
        if(it.rid){
          var r=state.recurring.filter(function(x){return x.id===it.rid;})[0];
          if(r && !rep) state.recurring=state.recurring.filter(function(x){return x.id!==it.rid;});
          else if(r){ r.repeat=rep; r.text=it.text; r.time=it.time; r.remind=it.remind; r.pri=it.pri; r.subs=it.subs.map(function(x){return x.text;}); }
        } else if(rep){
          var rid=uid();
          state.recurring.push({id:rid,scope:it.scope,sec:it.sec,text:it.text,time:it.time,remind:it.remind,pri:it.pri,subs:it.subs.map(function(x){return x.text;}),repeat:rep,start:it.date});
          it.rid=rid;
        }
        if(!it.rid && it.date>=todayStr()) it.handled=false;
      }
      save(); closeModal(); render(); return;
    }
    if(f.id==='carryForm'){
      var ids=new FormData(f).getAll('c'), t=todayStr();
      overdue().forEach(function(i){
        if(ids.indexOf(i.id)>=0){ i.date=t; } else { i.handled=true; }
      });
      save(); closeModal(); ui.date=t; ui.followToday=true; render(); toast(ids.length?'Carried to today':'Left behind'); return;
    }
    if(f.id==='plansForm'){
      var fd=new FormData(f);
      ['W1','W2','W3'].forEach(function(k){
        state.plans[k]={name:(fd.get('n'+k)||'').trim()||k, ex:(fd.get('e'+k)||'').split('\n').map(function(s){return s.trim();}).filter(Boolean)};
      });
      save(); closeModal(); render(); return;
    }
  });

  // ---------- daily refresh ----------
  var lastToday=todayStr(), lastDue=eveningDue();
  function tick(){
    var t=todayStr();
    if(t!==lastToday){
      lastToday=t;
      if(ui.followToday) ui.date=t;
      render();
    }
    var due=eveningDue();
    if(due!==lastDue){
      lastDue=due; render();
      if(due){
        toast('🌙 Time to plan tomorrow');
        try { if(window.Notification && Notification.permission==='granted') new Notification('Daybook',{body:'Time to plan tomorrow'}); } catch(e){}
      }
    }
    checkReminders();
  }
  setInterval(tick,20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) tick(); });

  // ---------- boot ----------
  applyTheme();
  render();
  tick();
  if(state.drive && state.drive.connected) getToken(false).catch(function(){});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
