<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pebble</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pebble">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#fafaf9; --surface:#ffffff; --line:#e7e5e4; --text:#1c1917; --muted:#78716c;
  --on:#fff; --accent:#4a6fa5; --accent-soft:#e8eef6; --warn:#a16207; --warn-soft:#fef7e0; --danger:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --on:#10161f; --bg:#141413; --surface:#1c1b1a; --line:#2e2c2a; --text:#f0eeec; --muted:#a8a29e;
    --accent:#8fb0e0; --accent-soft:#232c3a; --warn:#e5b94e; --warn-soft:#2c2616; --danger:#f08a8a;
  }
}
:root[data-theme="dark"]{
  --on:#10161f; --bg:#141413; --surface:#1c1b1a; --line:#2e2c2a; --text:#f0eeec; --muted:#a8a29e;
  --accent:#8fb0e0; --accent-soft:#232c3a; --warn:#e5b94e; --warn-soft:#2c2616; --danger:#f08a8a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.date-nav{display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.date-title{font-size:18px;font-weight:600;background:none;border:0;padding:4px 6px;position:relative}
.date-title small{display:block;font-size:12px;font-weight:400;color:var(--muted);text-align:left}
.date-title input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.link{background:none;border:0;color:var(--accent);padding:4px 6px;font-size:13px}
.tabs{display:flex;gap:2px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;color:var(--muted);font-weight:500}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding-top:16px}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner b{color:var(--warn)}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:7px 12px;font-weight:500}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
section.card h2{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{margin-top:1px;width:24px;height:24px;accent-color:var(--accent);flex:none;cursor:pointer}
.row .body{flex:1;min-width:0;cursor:pointer}
.row.done .txt{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.chip.t{color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
form.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
form.add input[type=text]{flex:1 1 150px;min-width:0}
input[type=text],input[type=time],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
form.add .extra{display:none;flex:1 0 100%;gap:6px}
form.add.open .extra{display:flex}
form.add .extra input,form.add .extra select{flex:1;width:auto}
form.add .more{border:1px solid var(--line);padding:6px 10px;font-size:15px}
form.add.open .more{background:var(--accent-soft);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--text)}
.plan-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.plan-chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.plan-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.group-title{display:flex;justify-content:space-between;align-items:baseline}
.sub{color:var(--muted);font-size:13px}
.day-label{font-size:12px;color:var(--muted);width:56px;flex:none;padding-top:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 12px;font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .sp{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.2)}
ol.steps{padding-left:18px;margin:6px 0}
code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:13px}
.carry-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:flex-start}
.field label.carry-row,label.carry-row{display:flex;font-size:inherit;color:var(--text);margin:0}
.carry-row input{margin-top:2px;width:22px;height:22px;flex:none}
#ptAdd select{width:auto}
.chip.pri-high{color:var(--danger);border-color:var(--danger)}
.chip.pri-med{color:var(--warn);border-color:var(--warn)}
.subs{margin-top:4px}
.sub-row{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:14px;color:var(--muted);cursor:pointer}
.sub-row input{width:20px;height:20px;accent-color:var(--accent)}
.sub-row.done span{text-decoration:line-through}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent)}
.stat-row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.stat-row .lbl{width:64px;color:var(--muted)}
.stat-row .num{width:44px;text-align:right;color:var(--muted)}
.big{font-size:28px;font-weight:600;line-height:1.1}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--muted)}
.days7 .d{border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--bg)}
.days7 .d.full{border-color:var(--accent);color:var(--text)}
.days7 .d b{display:block;font-weight:600;color:var(--text);font-size:13px}
textarea.rev{min-height:64px;resize:vertical}
mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.hit{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.hit .hb{flex:1;min-width:0;cursor:pointer}
.hit.done .ht{text-decoration:line-through;color:var(--muted)}
.hit .link{flex:none}
.search-box{position:sticky;top:-16px;background:var(--surface);padding:0 0 8px;z-index:1}
/* month view, quick add */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.mc{aspect-ratio:1/1.05;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.mc .n{font-size:14px}
.mc.today .n{font-weight:700;color:var(--accent)}
.mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.mc.blank{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}
.dots.dim{opacity:.35}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.work{background:var(--accent)}.dot.personal{background:#6fa58a}.dot.both{background:#e8a54b}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on);border:0;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
.agenda-h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.welcome ul{margin:6px 0 10px;padding-left:18px}
.welcome li{margin:3px 0}
.chip.late{color:var(--danger);border-color:var(--danger)}
.prog{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.prog .bar{height:8px}
.prog .txt2{font-size:13px;color:var(--muted);white-space:nowrap}
.streak{font-size:12px;color:var(--accent);margin:-6px 0 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="top">
      <div class="date-nav">
        <button class="icon-btn" data-act="prev" aria-label="Previous day">‹</button>
        <div class="date-title" id="dateTitle"></div>
        <button class="icon-btn" data-act="next" aria-label="Next day">›</button>
        <button class="link" data-act="today" id="todayBtn">Today</button>
      </div>
      <div style="display:flex;gap:2px">
        <button class="icon-btn" id="syncBtn" data-act="sync" hidden></button>
        <button class="icon-btn" data-act="search" aria-label="Search" title="Search (press /)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="themeBtn" data-act="theme"></button>
        <button class="icon-btn" data-act="settings" aria-label="Settings">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<button class="fab" id="fab" data-act="quickadd" aria-label="Add item" title="Add item">+</button>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(function(){
  'use strict';

  // ---------- config ----------
  var KEY = 'daybook2';
  var TABS = [['overview','Overview'],['personal','Personal'],['work','Work'],['both','Both'],['review','Review']];
  var SECTIONS = {
    personal: [
      {id:'goals',    label:'Personal goals',   persist:true, ph:'Add a goal'},
      {id:'tasks',    label:'Personal tasks',   ph:'Add a task'},
      {id:'chores',   label:'House chores',     ph:'Add a chore'},
      {id:'meals',    label:'Food / meal prep', ph:'Add a meal or prep item'},
      {id:'groceries',label:'Groceries to get', persist:true, ph:'Add an item'},
      {id:'workout',  label:'Workout plan',     special:true}
    ],
    work: [
      {id:'tasks',    label:'Work tasks',        ph:'Add a task'},
      {id:'meetings', label:'Meetings',          ph:'Add a meeting'},
      {id:'followups',label:'Follow-ups',        ph:'Add a follow-up'}
    ],
    both: [
      {id:'tasks',    label:'Shared tasks',          ph:'Add a task'},
      {id:'events',   label:'Events & appointments', ph:'Add an event'}
    ]
  };
  var SCOPE_LABEL = {work:'Work', personal:'Personal', both:'Both'};
  var REMIND = [['','No reminder'],['0','At time'],['10','10 min before'],['30','30 min before'],['60','1 hour before'],['1440','1 day before']];
  var PRI = [['','No priority'],['med','Medium'],['high','High']];
  var PRI_RANK = {high:2,med:1};
  var REPEAT = [['','Does not repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week']];
  var DEFAULT_PLANS = {
    W1:{name:'Push', ex:['Bench press 3×8','Overhead press 3×8','Incline dumbbell press 3×10','Triceps dips 3×10','Plank 3×45s']},
    W2:{name:'Pull', ex:['Pull-ups 3×8','Barbell row 3×8','Lat pulldown 3×10','Biceps curl 3×12','Face pulls 3×15']},
    W3:{name:'Legs', ex:['Squat 4×8','Romanian deadlift 3×8','Lunges 3×10 each','Calf raises 3×15','Core circuit 10 min']}
  };

  // ---------- state ----------
  var loadProblem = false;
  var stampCache = {};
  var state = load();
  function load(){
    var s = null, raw = null;
    try { raw = localStorage.getItem(KEY); s = JSON.parse(raw); }
    catch(e){ if(raw){ loadProblem = true; try { localStorage.setItem('daybook2-corrupt-'+Date.now(), raw); } catch(x){} } }
    s = s || {};
    s.items = (s.items || []).filter(function(i){ return i && typeof i.id==='string' && /^[\w.\-]+$/.test(i.id); }).map(function(i){ if(typeof i.text!=='string') i.text=String(i.text==null?'':i.text); return i; });
    s.recurring = s.recurring || [];
    s.plans = s.plans || JSON.parse(JSON.stringify(DEFAULT_PLANS));
    s.wdays = s.wdays || {};
    s.fired = s.fired || {};
    s.reviews = s.reviews || {};
    s.planned = s.planned || {};
    s.planSkip = s.planSkip || '';
    if(s.eveningHour==null) s.eveningHour = 20;
    s.tombs = s.tombs || {};
    initStamps(s);
    s.theme = s.theme || '';
    return s;
  }
  // ---- change tracking: every item/template/day-plan carries `u` (last changed). Deletions leave a tombstone.
  function stripU(o){ var c=Object.assign({},o); delete c.u; return JSON.stringify(c); }
  function initStamps(st){
    stampCache={};
    (st.items||[]).forEach(function(it){ if(!it.u) it.u=1; stampCache['i:'+it.id]=stripU(it); });
    (st.recurring||[]).forEach(function(r){ if(!r.u) r.u=1; stampCache['c:'+r.id]=stripU(r); });
    Object.keys(st.wdays||{}).forEach(function(k){ var v=st.wdays[k]; if(v&&typeof v==='object'){ if(!v.u) v.u=1; stampCache['w:'+k]=stripU(v); } });
    Object.keys(st.reviews||{}).forEach(function(k){ var v=st.reviews[k]; if(v&&typeof v==='object'){ if(!v.u) v.u=1; stampCache['r:'+k]=stripU(v); } });
    if(st.plans){ if(!st.plans.u) st.plans.u=1; stampCache['p']=stripU(st.plans); }
  }
  function stampChanges(){
    var now=Date.now(), seen={}; state.tombs=state.tombs||{};
    var chk=function(k,o){ seen[k]=1; var j=stripU(o); if(stampCache[k]!==j){ o.u=now; stampCache[k]=j; } };
    state.items.forEach(function(it){ chk('i:'+it.id,it); });
    state.recurring.forEach(function(r){ chk('c:'+r.id,r); });
    Object.keys(state.wdays).forEach(function(k){ if(state.wdays[k]&&typeof state.wdays[k]==='object') chk('w:'+k,state.wdays[k]); });
    Object.keys(state.reviews).forEach(function(k){ if(state.reviews[k]&&typeof state.reviews[k]==='object') chk('r:'+k,state.reviews[k]); });
    if(state.plans) chk('p',state.plans);
    Object.keys(stampCache).forEach(function(k){ if(!seen[k]){ delete stampCache[k]; if(k.charAt(0)==='i'||k.charAt(0)==='c') state.tombs[k]=now; } });
    var cutoff=now-90*86400000; Object.keys(state.tombs).forEach(function(k){ if(state.tombs[k]<cutoff) delete state.tombs[k]; });
  }
  // after a whole-state replace (restore/snapshot), anything that vanished must not come back from the cloud
  function tombstoneMissing(old){
    var now=Date.now(), have={};
    state.items.forEach(function(i){ have['i:'+i.id]=1; }); state.recurring.forEach(function(r){ have['c:'+r.id]=1; });
    (old.items||[]).forEach(function(i){ if(!have['i:'+i.id]) state.tombs['i:'+i.id]=now; });
    (old.recurring||[]).forEach(function(r){ if(!have['c:'+r.id]) state.tombs['c:'+r.id]=now; });
  }
  function persist(){ try { stampChanges(); localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function save(){ persist(); scheduleBackup(); }

  // ---------- dates ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseYmd(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function todayStr(){ return ymd(new Date()); }
  function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
  function fmtTime(t){ if(!t) return ''; var p=t.split(':'),h=+p[0]; return ((h%12)||12)+':'+p[1]+' '+(h<12?'AM':'PM'); }
  function longDate(s){ return parseYmd(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
  function shortDate(s){ return parseYmd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var ui = {tab:'overview', date:todayStr(), followToday:true, range:'day'};

  // ---------- section helpers ----------
  function secDef(scope,id){ return (SECTIONS[scope]||[]).filter(function(s){return s.id===id;})[0]; }
  function isPersist(it){ var d=secDef(it.scope,it.sec); return !!(d&&d.persist); }
  function live(){ return state.items.filter(function(i){return !i.gone;}); }
  function itemsFor(scope,sec,date){
    var persist = secDef(scope,sec).persist;
    return live().filter(function(i){
      return i.scope===scope && i.sec===sec && (persist || i.date===date);
    }).sort(cmpItems);
  }
  function cmpItems(a,b){
    if(!!a.done!==!!b.done) return a.done?1:-1;
    if(a.date!==b.date) return (a.date||'')<(b.date||'')?-1:1;
    var pa=PRI_RANK[a.pri]||0, pb=PRI_RANK[b.pri]||0;
    if(pa!==pb) return pb-pa;
    var ta=a.time||'99:99', tb=b.time||'99:99';
    return ta<tb?-1:ta>tb?1:0;
  }

  // ---------- recurring ----------
  function matches(r,date){
    if(date<r.start) return false;
    var dow=parseYmd(date).getDay();
    if(r.repeat==='daily') return true;
    if(r.repeat==='weekdays') return dow>0&&dow<6;
    if(r.repeat==='weekly') return dow===parseYmd(r.start).getDay();
    return false;
  }
  function ensureRecurring(date){
    var changed=false;
    state.recurring.forEach(function(r){
      if(!matches(r,date)) return;
      var has = state.items.some(function(i){return i.rid===r.id && i.date===date;});
      if(has) return;
      state.items.push({id:'r'+r.id+'-'+date,scope:r.scope,sec:r.sec,text:r.text,date:date,time:r.time,remind:r.remind,pri:r.pri||'',subs:(r.subs||[]).map(function(x,n){return {id:'s'+n,text:x,done:false};}),done:false,rid:r.id,
        handled: date<todayStr()});
      changed=true;
    });
    if(changed) save();
  }

  // ---------- carry forward (always asks) ----------
  function overdue(){
    var t=todayStr();
    return live().filter(function(i){
      return i.date && i.date<t && !i.done && !i.handled && !i.rid && !isPersist(i);
    }).sort(cmpItems);
  }

  // ---------- reminders ----------
  function fireAt(it){
    if(!it.date || it.remind==null || it.remind==='' || it.done || it.gone) return null;
    var p=(it.time||'09:00').split(':'), d=parseYmd(it.date);
    d.setHours(+p[0],+p[1],0,0);
    var m=+it.remind||0;
    if(it.time) d.setMinutes(d.getMinutes()-m);
    else if(m>=1440) d.setDate(d.getDate()-Math.floor(m/1440));
    return d;
  }
  function showNotice(body){
    try {
      if(!(window.Notification && Notification.permission==='granted')) return;
      if(navigator.serviceWorker && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(function(reg){ return reg.showNotification('Pebble',{body:body,tag:'pebble-'+body.slice(0,40),icon:'icon-192.png',badge:'icon-192.png'}); })
          .catch(function(){ try{ new Notification('Pebble',{body:body}); }catch(e){} });
      } else new Notification('Pebble',{body:body});
    } catch(e){}
  }
  // First time you set a reminder (a tap), ask for permission so alerts can work.
  function askNotifyOnce(){
    if(state.askedNotif || !window.Notification || Notification.permission!=='default') return;
    state.askedNotif=true; persist();
    try { Notification.requestPermission(); } catch(e){}
  }
  function calendarHint(it){
    if(!it || !it.date || !it.time || it.remind==null || it.remind==='') return;
    var n=state.calHints||0; if(n>=3) return;
    state.calHints=n+1; persist();
    toast('Reminder set. To be alerted even when Pebble is closed, add it to your Calendar.','Add',function(){ exportIcs([it],'pebble-item.ics'); });
  }
  function checkReminders(){
    ensureRecurring(todayStr());
    var now=new Date(), changed=false;
    live().forEach(function(it){
      var f=fireAt(it); if(!f) return;
      var key=it.id+'|'+it.date+'|'+it.time+'|'+it.remind;
      var age=now-f;
      if(age>=0 && age<3*3600*1000 && !state.fired[key]){
        state.fired[key]=Date.now(); changed=true;
        var msg=(it.time?fmtTime(it.time)+' · ':'')+it.text;
        toast('🔔 '+msg);
        showNotice(msg);
      }
    });
    var cutoff=Date.now()-3*86400000;
    Object.keys(state.fired).forEach(function(k){ if(state.fired[k]<cutoff){delete state.fired[k];changed=true;} });
    if(changed) save();
  }
  function toast(msg,actLabel,act){
    var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
    if(actLabel){
      var b=document.createElement('button'); b.textContent=actLabel;
      b.style.cssText='background:none;border:0;color:inherit;text-decoration:underline;margin-left:12px;font-weight:600;padding:0';
      b.addEventListener('click',function(ev){ ev.stopPropagation(); el.remove(); act(); });
      el.appendChild(b);
    }
    document.getElementById('toasts').appendChild(el);
    setTimeout(function(){ el.remove(); }, actLabel?9000:6000);
    el.addEventListener('click',function(){ el.remove(); });
  }

  // ---------- Apple Calendar / Reminders ----------
  function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function icsDT(date,time,addMin){
    var p=(time||'00:00').split(':'), d=parseYmd(date); d.setHours(+p[0],+p[1]+(addMin||0),0,0);
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  }
  function buildIcs(items){
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pebble//EN','CALSCALE:GREGORIAN'];
    var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    items.forEach(function(it){
      L.push('BEGIN:VEVENT','UID:'+it.id+'-'+it.date+'@daybook','DTSTAMP:'+stamp,'SUMMARY:'+icsEsc(it.text),
        'CATEGORIES:'+SCOPE_LABEL[it.scope]);
      if(it.pri) L.push('PRIORITY:'+(it.pri==='high'?1:5));
      if((it.subs||[]).length) L.push('DESCRIPTION:'+icsEsc(it.subs.map(function(x){return (x.done?'[x] ':'[ ] ')+x.text;}).join('\n')));
      if(it.time){ L.push('DTSTART:'+icsDT(it.date,it.time,0),'DTEND:'+icsDT(it.date,it.time,60)); }
      else { L.push('DTSTART;VALUE=DATE:'+it.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(it.date,1).replace(/-/g,'')); }
      if(it.remind!=null && it.remind!==''){
        L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.text),
          'TRIGGER:'+(it.time ? '-PT'+(+it.remind)+'M' : (+it.remind>=1440 ? '-PT15H' : 'PT9H')),'END:VALARM');
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function download(name,mime,text){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:mime}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }
  function exportIcs(items,name){
    items=items.filter(function(i){return i.date;});
    if(!items.length){ toast('Nothing dated to export'); return; }
    download(name,'text/calendar',buildIcs(items));
  }
  function sendToReminders(items){
    items=items.filter(function(i){return i.date && !i.done;});
    if(!items.length){ toast('Nothing to send'); return; }
    var payload=JSON.stringify(items.map(function(i){
      return {title:i.text,date:i.date,time:i.time||'',list:SCOPE_LABEL[i.scope],priority:i.pri||'',subtasks:(i.subs||[]).map(function(x){return x.text;})};
    }));
    window.location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Daybook to Reminders')+
      '&input=text&text='+encodeURIComponent(payload);
  }
  function itemsOnDay(date){ return live().filter(function(i){return i.date===date && !isPersist(i);}); }

  // ---------- rendering ----------
  function render(){
    setSync();
    ensureRecurring(ui.date);
    var t=todayStr();
    document.getElementById('dateTitle').innerHTML =
      '<small>'+(ui.date===t?'Today':ui.date<t?'Past':'Upcoming')+'</small>'+esc(shortDate(ui.date))+
      '<input type="date" id="datePick" value="'+ui.date+'">';
    document.getElementById('todayBtn').style.display = ui.date===t?'none':'';
    document.getElementById('tabs').innerHTML = TABS.map(function(x){
      return '<button class="tab'+(ui.tab===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>';
    }).join('');
    var h = legacyBanner() + planBanner() + carryBanner() + (ui.tab==='overview' ? welcomeCard() + nudgeBanner() : '') + (ui.tab==='overview' ? renderOverview() : ui.tab==='review' ? renderReview() : renderScope(ui.tab));
    document.getElementById('app').innerHTML = h;
  }

  // ---------- evening planning ----------
  function tomorrowStr(){ return addDays(todayStr(),1); }
  function eveningDue(){
    var h=state.eveningHour;
    if(h==null || h<0) return false;
    return new Date().getHours()>=h && !state.planned[tomorrowStr()] && state.planSkip!==todayStr();
  }
  function planBanner(){
    if(ui.date!==todayStr() || !eveningDue()) return '';
    return '<div class="banner" style="background:var(--accent-soft)"><span><b style="color:var(--accent)">Plan tomorrow</b> · take a minute to set up '+esc(shortDate(tomorrowStr()))+'.</span>'+
      '<button class="btn" data-act="plan">Plan</button></div>';
  }

  function carryBanner(){
    var n=overdue().length;
    if(!n) return '';
    return '<div class="banner"><span><b>'+n+' unfinished</b> from earlier days. Carry them to today?</span>'+
      '<button class="btn" data-act="carry">Review</button></div>';
  }

  function rowHtml(it,showDate){
    var chips='';
    if(it.time) chips+='<span class="chip t">'+fmtTime(it.time)+'</span>';
    if(it.remind!=null && it.remind!=='') chips+='<span class="chip">🔔 '+esc(remindLabel(it))+'</span>';
    if(it.rid) chips+='<span class="chip">↻</span>';
    if(!it.done && it.date && it.time){ var due=parseYmd(it.date), tp=it.time.split(':'); due.setHours(+tp[0],+tp[1],0,0); if(due<new Date()) chips='<span class="chip late">Overdue</span>'+chips; }
    var subs=it.subs||[];
    if(it.pri) chips='<span class="chip pri-'+it.pri+'">⚑ '+(it.pri==='high'?'High':'Medium')+'</span>'+chips;
    if(subs.length) chips+='<span class="chip">'+subs.filter(function(x){return x.done;}).length+'/'+subs.length+' subtasks</span>';
    var subHtml=subs.length?'<div class="subs" data-subrow="1">'+subs.map(function(x){
      return '<label class="sub-row'+(x.done?' done':'')+'"><input type="checkbox" data-sub="'+it.id+'|'+x.id+'"'+(x.done?' checked':'')+'><span>'+esc(x.text)+'</span></label>';
    }).join('')+'</div>':'';
    return '<div class="row'+(it.done?' done':'')+'">'+
      (showDate?'<div class="day-label">'+esc(shortDate(it.date).replace(/,.*/,''))+'<br>'+esc(parseYmd(it.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'</div>':'')+
      '<input type="checkbox" data-toggle="'+it.id+'"'+(it.done?' checked':'')+' aria-label="Done">'+
      '<div class="body" data-edit="'+it.id+'"><div class="txt">'+esc(it.text)+'</div>'+(chips?'<div class="chips">'+chips+'</div>':'')+subHtml+'</div></div>';
  }
  function remindLabel(it){
    if(!it.time) return (+it.remind>=1440)?'day before':'morning of';
    var m=REMIND.filter(function(r){return r[0]===String(it.remind);})[0];
    return m?m[1].toLowerCase():'';
  }

  function renderScope(scope){
    return SECTIONS[scope].map(function(sec){
      if(sec.special) return renderWorkout();
      var its=itemsFor(scope,sec.id,ui.date), persist=!!sec.persist;
      var head='<h2><span>'+sec.label+'</span>'+
        (sec.id==='groceries' && its.some(function(i){return i.done;}) ? '<button class="link" data-clear="1">Clear done</button>' : '')+'</h2>';
      var list=its.length ? its.map(function(i){return rowHtml(i,false);}).join('') : '<div class="empty">Nothing here yet.</div>';
      var form='<form class="add" data-scope="'+scope+'" data-sec="'+sec.id+'">'+
        '<input type="text" placeholder="'+sec.ph+'" aria-label="'+sec.ph+'" autocomplete="off">'+
        (persist?'':'<button class="icon-btn more" type="button" data-more="1" aria-label="Time and reminder" title="Time and reminder">⏱</button>')+
        '<button class="btn" type="submit">Add</button>'+
        (persist?'':'<div class="extra"><input type="time" aria-label="Time">'+
        '<select aria-label="Reminder">'+REMIND.map(function(r){return '<option value="'+r[0]+'"'+(r[0]==='0'?' selected':'')+'>'+r[1]+'</option>';}).join('')+'</select>'+
        '<select aria-label="Priority" data-pri="1">'+PRI.map(function(r){return '<option value="'+r[0]+'">'+(r[0]?'⚑ ':'')+r[1]+'</option>';}).join('')+'</select></div>')+
        '</form>';
      return '<section class="card">'+head+list+form+'</section>';
    }).join('');
  }

  function renderWorkout(){
    var wd=state.wdays[ui.date]||{plan:'',done:{}};
    var chips=['W1','W2','W3'].map(function(k){
      return '<button data-plan="'+k+'" class="'+(wd.plan===k?'on':'')+'">'+k+'</button>';
    }).join('')+'<button data-plan="" class="'+(!wd.plan?'on':'')+'">Rest</button>';
    var body='';
    if(wd.plan && state.plans[wd.plan]){
      var p=state.plans[wd.plan];
      body='<div class="sub" style="margin-bottom:4px">'+esc(wd.plan)+' · '+esc(p.name)+'</div>'+
        p.ex.map(function(e,i){
          var d=wd.done&&wd.done[i];
          return '<div class="row'+(d?' done':'')+'"><input type="checkbox" data-wex="'+i+'"'+(d?' checked':'')+'><div class="body" data-wex-row="'+i+'"><div class="txt">'+esc(e)+'</div></div></div>';
        }).join('');
    } else body='<div class="empty">Rest day. Pick W1, W2 or W3 to list that workout.</div>';
    return '<section class="card"><h2><span>Workout plan</span><button class="link" data-act="plans">Edit plans</button></h2>'+
      '<div class="plan-chips">'+chips+'</div>'+
      '<form class="add" data-plan-form="1" style="margin:0 0 6px"><input type="text" placeholder="Type W1, W2 or W3" aria-label="Workout code" autocomplete="off"><button class="btn ghost" type="submit">Set</button></form>'+
      body+'</section>';
  }


  // ---------- weekly review ----------
  function weekStart(date){ var d=parseYmd(date); return addDays(date,-((d.getDay()+6)%7)); }
  function bar(done,total){ return '<div class="bar"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>'; }
  function renderReview(){
    var ws=weekStart(ui.date), we=addDays(ws,6), t=todayStr(), i;
    for(i=0;i<14;i++){ var dd=addDays(ws,i); if(dd>=t) ensureRecurring(dd); }
    var inWeek=function(a,b){ return live().filter(function(x){return x.date && x.date>=a && x.date<=b && !isPersist(x);}); };
    var its=inWeek(ws,we), done=its.filter(function(x){return x.done;}).length;
    var rv=state.reviews[ws]||{}, prev=state.reviews[addDays(ws,-7)]||{};
    var rng=shortDate(ws).replace(/^\w+, /,'')+' – '+shortDate(we).replace(/^\w+, /,'');
    var h='<div class="week-nav"><button class="icon-btn" data-act="wk-prev" aria-label="Previous week">‹</button>'+
      '<div style="text-align:center"><div style="font-weight:600">'+esc(rng)+'</div><div class="sub">'+(ws<=t&&t<=we?'This week':we<t?'Past week':'Upcoming week')+'</div></div>'+
      '<button class="icon-btn" data-act="wk-next" aria-label="Next week">›</button></div>';

    // summary
    h+='<section class="card"><h2><span>Completed</span></h2>'+
      (its.length ? '<div class="big">'+done+' of '+its.length+' <span class="sub">('+Math.round(done/its.length*100)+'%)</span></div>' : '<div class="empty">No dated items this week.</div>');
    ['work','personal','both'].forEach(function(sc){
      var g=its.filter(function(x){return x.scope===sc;}), gd=g.filter(function(x){return x.done;}).length;
      if(g.length) h+='<div class="stat-row"><span class="lbl">'+SCOPE_LABEL[sc]+'</span>'+bar(gd,g.length)+'<span class="num">'+gd+'/'+g.length+'</span></div>';
    });
    var hi=its.filter(function(x){return x.pri==='high';});
    if(hi.length) h+='<div class="stat-row"><span class="lbl">⚑ High</span>'+bar(hi.filter(function(x){return x.done;}).length,hi.length)+'<span class="num">'+hi.filter(function(x){return x.done;}).length+'/'+hi.length+'</span></div>';
    h+='</section>';

    // day strip + workouts
    var planned=0, finished=0, cells='';
    for(i=0;i<7;i++){
      var d=addDays(ws,i), di=its.filter(function(x){return x.date===d;}), dn=di.filter(function(x){return x.done;}).length;
      var wd=state.wdays[d], wl='';
      if(wd && wd.plan && state.plans[wd.plan]){
        var n=state.plans[wd.plan].ex.length, c=Object.keys(wd.done||{}).filter(function(k){return wd.done[k];}).length;
        planned++; if(n&&c>=n) finished++;
        wl='<br>'+wd.plan+' '+c+'/'+n;
      }
      cells+='<div class="d'+(di.length&&dn===di.length?' full':'')+'"><b>'+parseYmd(d).toLocaleDateString(undefined,{weekday:'narrow'})+'</b>'+(di.length?dn+'/'+di.length:'–')+wl+'</div>';
    }
    h+='<section class="card"><h2><span>Day by day</span></h2><div class="days7">'+cells+'</div>'+
      '<div class="sub" style="margin-top:8px">'+(planned?'Workouts finished: '+finished+' of '+planned+' planned.':'No workouts planned this week.')+'</div></section>';

    // unfinished
    var open=its.filter(function(x){return !x.done && !x.rid && x.date<t;}).sort(cmpItems);
    if(open.length){
      h+='<section class="card"><h2><span>Didn’t get done</span></h2>'+open.map(function(x){
        return '<label class="carry-row"><input type="checkbox" data-wk="'+x.id+'" checked><span><div>'+esc(x.text)+'</div><div class="sub">'+SCOPE_LABEL[x.scope]+' · '+esc(shortDate(x.date))+'</div></span></label>';
      }).join('')+'<div class="actions"><button class="btn" data-act="wk-move">Move selected to today</button></div></section>';
    }

    // reflection
    h+='<section class="card"><h2><span>Reflect</span></h2>'+
      (prev.focus?'<div class="banner" style="margin-bottom:10px"><span><b>Last week’s focus:</b> '+esc(prev.focus)+'</span></div>':'')+
      [['wins','What went well?'],['issues','What got in the way?'],['focus','Focus for next week']].map(function(f){
        return '<div class="field"><label>'+f[1]+'</label><textarea class="rev" data-rev="'+f[0]+'" data-week="'+ws+'">'+esc(rv[f[0]]||'')+'</textarea></div>';
      }).join('')+'</section>';

    // next week
    var nx=inWeek(addDays(we,1),addDays(we,7)).filter(function(x){return !x.done;}).sort(function(a,b){
      var pa=PRI_RANK[a.pri]||0, pb=PRI_RANK[b.pri]||0; if(pa!==pb) return pb-pa; return a.date<b.date?-1:a.date>b.date?1:0; });
    h+='<section class="card"><h2><span>Next week</span><span style="font-weight:400">'+nx.length+' planned</span></h2>'+
      (nx.length ? nx.slice(0,6).map(function(x){return rowHtml(x,true);}).join('')+(nx.length>6?'<div class="empty">+ '+(nx.length-6)+' more</div>':'') : '<div class="empty">Nothing planned yet.</div>')+'</section>';
    return h;
  }

  // consecutive days (ending today, or yesterday if nothing is done yet today) with at least one finished item
  function streakDays(){
    var doneOn={}; live().forEach(function(i){ if(i.done && i.date && !isPersist(i)) doneOn[i.date]=1; });
    var d=todayStr(); if(!doneOn[d]) d=addDays(d,-1);
    var n=0; while(doneOn[d]){ n++; d=addDays(d,-1); } return n;
  }
  function rangeSeg(){
    return '<span class="seg">'+[['day','Day'],['week','7 days'],['month','Month']].map(function(r){
      return '<button data-range="'+r[0]+'" class="'+(ui.range===r[0]?'on':'')+'">'+r[1]+'</button>';
    }).join('')+'</span>';
  }
  function renderMonth(){
    var d=parseYmd(ui.date), y=d.getFullYear(), mo=d.getMonth(), t=todayStr();
    var first=new Date(y,mo,1), lead=(first.getDay()+6)%7, n=new Date(y,mo+1,0).getDate();
    var ms=ymd(first), me=ymd(new Date(y,mo,n));
    var its=live().filter(function(i){return i.date && i.date>=ms && i.date<=me && !isPersist(i);});
    var done=its.filter(function(i){return i.done;}).length, by={};
    its.forEach(function(i){ (by[i.date]=by[i.date]||[]).push(i); });
    var h='<div class="group-title" style="margin-bottom:12px"><span class="sub">'+its.length+(its.length===1?' item':' items')+' this month · '+done+' done</span>'+rangeSeg()+'</div>';
    h+='<section class="card"><div class="week-nav" style="margin-bottom:6px"><button class="icon-btn" data-act="mo-prev" aria-label="Previous month">‹</button><b>'+esc(first.toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'</b><button class="icon-btn" data-act="mo-next" aria-label="Next month">›</button></div><div class="cal">';
    ['M','T','W','T','F','S','S'].forEach(function(w){ h+='<div class="wd">'+w+'</div>'; });
    for(var b=0;b<lead;b++) h+='<div class="mc blank"></div>';
    for(var day=1;day<=n;day++){
      var ds=ymd(new Date(y,mo,day)), g=by[ds]||[];
      var dots=['work','personal','both'].filter(function(sc){return g.some(function(i){return i.scope===sc;});}).map(function(sc){return '<i class="dot '+sc+'"></i>';}).join('');
      var all=g.length && g.every(function(i){return i.done;});
      h+='<button class="mc'+(ds===t?' today':'')+(ds===ui.date?' sel':'')+'" data-day="'+ds+'" aria-label="'+esc(longDate(ds))+(g.length?', '+g.length+' items':'')+'"><span class="n">'+day+'</span><span class="dots'+(all?' dim':'')+'">'+dots+'</span></button>';
    }
    h+='</div><div class="legend"><span><i class="dot work"></i> Work</span><span><i class="dot personal"></i> Personal</span><span><i class="dot both"></i> Both</span></div></section>';
    var dayItems=(by[ui.date]||[]).slice().sort(function(a,b){var ta=a.time||'99:99',tb=b.time||'99:99';return ta<tb?-1:ta>tb?1:0;});
    h+='<section class="card"><h2><span>'+esc(longDate(ui.date))+'</span><span style="font-weight:400">'+dayItems.length+'</span></h2>';
    if(!dayItems.length) h+='<div class="empty">Nothing planned. Tap + to add something.</div>';
    ['work','personal','both'].forEach(function(sc){
      var g=dayItems.filter(function(i){return i.scope===sc;}); if(!g.length) return;
      h+='<div class="agenda-h">'+SCOPE_LABEL[sc]+'</div>'+g.map(function(i){return rowHtml(i,false);}).join('');
    });
    return h+'</section>';
  }

  function renderOverview(){
    if(ui.range==='month') return renderMonth();
    var start=ui.date, end=ui.range==='week'?addDays(start,6):start;
    var its=live().filter(function(i){return i.date && i.date>=start && i.date<=end && !isPersist(i);});
    var done=its.filter(function(i){return i.done;}).length;
    var h='<div class="group-title" style="margin-bottom:12px;gap:12px"><span class="prog">'+bar(done,its.length)+'<span class="txt2">'+done+' of '+its.length+' done</span></span>'+rangeSeg()+'</div>';
    var sk=streakDays(); if(sk>=2) h+='<div class="streak">'+sk+'-day streak · you finished something each day</div>';
    ['work','personal','both'].forEach(function(scope){
      var g=its.filter(function(i){return i.scope===scope;}).sort(function(a,b){
        if(a.date!==b.date) return a.date<b.date?-1:1;
        var ta=a.time||'99:99', tb=b.time||'99:99'; return ta<tb?-1:ta>tb?1:0;
      });
      var extra='';
      if(scope==='personal'){
        var wd=state.wdays[ui.date];
        if(ui.range==='day' && wd && wd.plan && state.plans[wd.plan]){
          var p=state.plans[wd.plan], c=Object.keys(wd.done||{}).filter(function(k){return wd.done[k];}).length;
          extra+='<div class="row"><div class="body" data-goto="personal"><div class="txt">Workout · '+esc(wd.plan)+' '+esc(p.name)+'</div><div class="chips"><span class="chip">'+c+'/'+p.ex.length+' done</span></div></div></div>';
        }
        var gro=live().filter(function(i){return i.scope==='personal'&&i.sec==='groceries'&&!i.done;}).length;
        if(gro) extra+='<div class="row"><div class="body" data-goto="personal"><div class="txt">Groceries to get</div><div class="chips"><span class="chip">'+gro+' items</span></div></div></div>';

    if(!n) return null;

      keys.sort().reverse().slice(7).forEach(function(n){ localStorage.removeItem(n); });
    } catch(e){}
  }
  function listSnaps(){
    var out=[];
    try { for(var i=0;i<localStorage.length;i++){ var n=localStorage.key(i);
      if(n && n.indexOf(SNAP)===0){ var c=null; try{ c=JSON.parse(localStorage.getItem(n)); }catch(e){} if(c&&Array.isArray(c.items)) out.push({date:n.slice(SNAP.length),count:c.items.length}); } } } catch(e){}

      return {text:text.replace(m[0],'').replace(/\s{2,}/g,' ').trim(), time:pad(h)+':'+(m[2]||'00')};
    }
    m=text.match(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(m) return {text:text.replace(m[0],'').replace(/\s{2,}/g,' ').trim(), time:pad(+m[1])+':'+m[2]};
    return {text:text.trim(), time:''};

    if((el=t.closest('[data-plan]'))){
      state.wdays[ui.date]={plan:el.getAttribute('data-plan'),done:{}}; save(); render(); return;
    }
    if((el=t.closest('[data-wex-row]'))){
      var wd=state.wdays[ui.date]; if(wd){ wd.done=wd.done||{}; var k=el.getAttribute('data-wex-row'); wd.done[k]=!wd.done[k]; save(); render(); } return;
    }
    if(t.closest('[data-clear]')){
      var cleared=state.items.filter(function(i){return i.sec==='groceries'&&i.done;});
      state.items=state.items.filter(function(i){return !(i.sec==='groceries'&&i.done);}); save(); render();
      if(cleared.length) toast('Cleared '+cleared.length+' item'+(cleared.length===1?'':'s'),'Undo',function(){ cleared.forEach(function(g){ state.items.push(g); }); save(); render(); });
      return;
    }
    if((el=t.closest('[data-del]'))){
      var it=findItem(el.getAttribute('data-del'));
      if(it){
        var idx=state.items.indexOf(it), wasRid=!!it.rid;
        if(wasRid) it.gone=true; else state.items=state.items.filter(function(i){return i!==it;});
        save();
        toast('Deleted “'+(it.text.length>28?it.text.slice(0,28)+'…':it.text)+'”','Undo',function(){
          if(wasRid) it.gone=false; else state.items.splice(Math.min(idx,state.items.length),0,it);
          save(); render();
        });
      }
      closeModal(); render(); return;
    }
    if((el=t.closest('[data-item-ics]'))){ var a=findItem(el.getAttribute('data-item-ics')); if(a) exportIcs([a],'pebble-item.ics'); return; }
    if((el=t.closest('[data-item-rem]'))){ var b=findItem(el.getAttribute('data-item-rem')); if(b) sendToReminders([b]); return; }
    if(t.closest('[data-close]') || t.getAttribute('data-modal-bg')){ closeModal(); return; }
    if((el=t.closest('[data-act]'))){
      var act=el.getAttribute('data-act');
      if(act==='prev'||act==='next'){ ui.date=addDays(ui.date,act==='prev'?-1:1); ui.followToday=(ui.date===todayStr()); render(); }
      else if(act==='today'){ ui.date=todayStr(); ui.followToday=true; render(); }
      else if(act==='search') openSearch();
      else if(act==='theme'){ state.theme=isDark()?'light':'dark'; save(); applyTheme(); }
      else if(act==='mo-prev'||act==='mo-next'){
        var cd=parseYmd(ui.date), tgt=new Date(cd.getFullYear(),cd.getMonth()+(act==='mo-prev'?-1:1),1);
        var dim=new Date(tgt.getFullYear(),tgt.getMonth()+1,0).getDate();
        ui.date=ymd(new Date(tgt.getFullYear(),tgt.getMonth(),Math.min(cd.getDate(),dim))); ui.followToday=(ui.date===todayStr()); render();
      }
      else if(act==='quickadd') openQuickAdd();
      else if(act==='legacy-import') openLegacy();
      else if(act==='sheet-recover') recoverFromSheet();
      else if(act==='legacy-skip'){ state.legacy=Object.assign(state.legacy||{},{dismissed:true}); persist(); render(); }
      else if(act==='legacy-download'){ var rawOld=null; try{ rawOld=localStorage.getItem('daybook-data'); }catch(e){} if(rawOld) download('old-daybook-data-'+todayStr()+'.json','application/json',rawOld); else toast('No old data found'); }
      else if(act==='nudge-later'){ state.nudgeUntil=addDays(todayStr(),14); persist(); render(); }
      else if(act==='nudge-setup'){ openSettings(); }
      else if(act==='welcome-ok'){ state.welcomed=true; persist(); render(); }
      else if(act==='welcome-show'){ state.welcomed=false; persist(); closeModal(); ui.tab='overview'; render(); }
      else if(act==='snap-restore'){ restoreSnapshot(el.getAttribute('data-snap')); }
      else if(act==='carry') openCarry();
      else if(act==='plan'){ ui.ptOff=[]; openPlan(); }
      else if(act==='plan-skip'){ state.planSkip=todayStr(); save(); closeModal(); render(); }
      else if(act==='plan-done'){
        var tm=tomorrowStr(), moved=0;
        document.querySelectorAll('input[data-pt]:checked').forEach(function(c){
          var m=findItem(c.getAttribute('data-pt')); if(m){ m.date=tm; m.handled=false; moved++; }
        });
        var w=document.getElementById('ptWorkout').value;
        if(w) state.wdays[tm]={plan:w,done:(state.wdays[tm]&&state.wdays[tm].plan===w)?state.wdays[tm].done:{}};
        else if(state.wdays[tm]) state.wdays[tm]={plan:'',done:{}};
        state.planned[tm]=true; save(); closeModal(); render(); toast('Tomorrow is planned'+(moved?' · '+moved+' moved':''));
      }
      else if(act==='wk-prev'||act==='wk-next'){ ui.date=addDays(weekStart(ui.date),act==='wk-prev'?-7:7); ui.followToday=(ui.date===todayStr()); render(); }
      else if(act==='wk-move'){
        var tt=todayStr(), n=0;
        document.querySelectorAll('input[data-wk]:checked').forEach(function(c){
          var m=findItem(c.getAttribute('data-wk')); if(m){ m.date=tt; m.handled=false; n++; }
        });
        save(); render(); toast(n?'Moved to today':'Nothing selected');
      }
      else if(act==='plans') openPlans();
      else if(act==='settings') openSettings();
      else if(act==='ics-day') exportIcs(itemsOnDay(ui.date),'pebble-'+ui.date+'.ics');
      else if(act==='rem-day') sendToReminders(itemsOnDay(ui.date));
      else if(act==='notif'){
        if(window.Notification) Notification.requestPermission().then(openSettings); else toast('Notifications not supported here');
      }
      else if(act==='drive-connect') driveConnect();
      else if(act==='drive-backup') driveSyncClick();
      else if(act==='sync'){ if(tokenValid()) driveSyncClick(); else { driveRun('Reconnecting',function(){ return getToken(true).then(function(){ return syncNow(true); }).then(function(){ return 'Synced'; }); }); } }
      else if(act==='drive-restore') driveRestoreClick();
      else if(act==='drive-disconnect') driveDisconnect();
      else if(act==='backup'){ state.lastExport=todayStr(); persist(); download('pebble-backup-'+todayStr()+'.json','application/json',JSON.stringify(state,null,2)); }
    }
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='searchInput') renderSearch(e.target.value);
  });
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='Escape' && document.getElementById('modalRoot').firstChild){ closeModal(); return; }
    var typing = tag==='input'||tag==='textarea'||tag==='select';
    if((e.key==='/' && !typing && !e.metaKey && !e.ctrlKey) || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
      e.preventDefault(); openSearch();
    }
  });

  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='datePick' && t.value){ ui.date=t.value; ui.followToday=(ui.date===todayStr()); render(); return; }
    if(t.hasAttribute('data-sub')){
      var ids=t.getAttribute('data-sub').split('|'), pit=findItem(ids[0]);
      if(pit){
        (pit.subs||[]).forEach(function(x){ if(x.id===ids[1]) x.done=t.checked; });
        save(); render();
        if(t.checked && !pit.done && pit.subs.length && pit.subs.every(function(x){return x.done;}))
          toast('All steps done. Mark “'+(pit.text.length>24?pit.text.slice(0,24)+'…':pit.text)+'” done?','Mark done',function(){ pit.done=true; save(); render(); });
      } return;
    }
    if(t.hasAttribute('data-toggle')){
      var it=findItem(t.getAttribute('data-toggle')); if(it){ it.done=t.checked; save(); render(); } return;
    }
    if(t.hasAttribute('data-wex')){
      var wd=state.wdays[ui.date]; if(wd){ wd.done=wd.done||{}; wd.done[t.getAttribute('data-wex')]=t.checked; save(); render(); } return;
    }
    if(t.hasAttribute('data-rev')){
      var wk=t.getAttribute('data-week'); state.reviews[wk]=state.reviews[wk]||{}; state.reviews[wk][t.getAttribute('data-rev')]=t.value; save(); return;
    }
    if(t.hasAttribute('data-pt')){
      var id=t.getAttribute('data-pt'), arr=ui.ptOff||(ui.ptOff=[]), ix=arr.indexOf(id);
      if(t.checked && ix>=0) arr.splice(ix,1); else if(!t.checked && ix<0) arr.push(id);
      return;
    }
    if(t.id==='edArea'){ document.getElementById('edSec').innerHTML=secOptsFor(t.value,'tasks'); return; }
    if(t.id==='qaArea'){ document.getElementById('qaSec').innerHTML=qaSecOpts(t.value); document.getElementById('qaWhen').style.display=''; return; }
    if(t.id==='qaSec'){ var sd=secDef(document.getElementById('qaArea').value,t.value); document.getElementById('qaWhen').style.display=(sd&&sd.persist)?'none':''; return; }
    if(t.id==='driveAuto'){ drv().auto=t.checked; persist(); return; }
    if(t.id==='eveSel'){ state.eveningHour=parseInt(t.value,10); save(); render(); return; }
    if(t.id==='themeSel'){ state.theme=t.value; save(); applyTheme(); return; }
    if(t.id==='importFile' && t.files[0]){
      var r=new FileReader();
      r.onload=function(){
        try {
          var d=JSON.parse(r.result);
          if(!d||!Array.isArray(d.items)) throw 0;
          var keepDrive=state.drive, oldSt=state; delete d.drive; localStorage.setItem(KEY,JSON.stringify(d)); state=load(); state.drive=keepDrive||{}; tombstoneMissing(oldSt); persist(); applyTheme(); closeModal(); render(); toast('Imported');
        } catch(err){ toast('That file is not a Pebble backup'); }
      };
      r.readAsText(t.files[0]);
    }
  });

  document.addEventListener('submit',function(e){
    var f=e.target; e.preventDefault();
    if(f.hasAttribute('data-plan-form')){
      var v=f.querySelector('input').value.trim().toLowerCase(), m=v.match(/^w?([1-3])$/);
      if(m) state.wdays[ui.date]={plan:'W'+m[1],done:{}};
      else if(/^(rest|off|none|)$/.test(v)) state.wdays[ui.date]={plan:'',done:{}};
      else { toast('Use W1, W2 or W3'); return; }
      save(); render(); return;
    }
    if(f.id==='ptAdd'){
      var raw=f.querySelector('input').value.trim(); if(!raw) return;
      var txt=raw, pri='', bang=txt.match(/\s*(!{1,2})\s*$/);
      if(bang){ pri=bang[1].length>1?'high':'med'; txt=txt.slice(0,bang.index).trim()||txt; }
      var x=extractTime(txt);
      state.items.push({id:uid(),scope:f.querySelector('select').value,sec:'tasks',text:x.text||txt,date:tomorrowStr(),time:x.time,remind:x.time?'0':'',pri:pri,subs:[],done:false});
      save(); openPlan(); render(); var ni=document.querySelector('#ptAdd input'); if(ni) ni.focus(); return;
    }
    if(f.classList.contains('add')){
      var scope=f.getAttribute('data-scope'), sec=f.getAttribute('data-sec'), persist=secDef(scope,sec).persist;
      var inp=f.querySelector('input[type=text]'), raw=inp.value.trim(); if(!raw) return;
      var time='', text=raw, pri='';
      var bang=text.match(/\s*(!{1,2})\s*$/);
      if(bang){ pri=bang[1].length>1?'high':'med'; text=text.slice(0,bang.index).trim()||text; }
      if(!persist){
        var tin=f.querySelector('input[type=time]').value;
        if(tin) time=tin; else { var x=extractTime(text); text=x.text||text; time=x.time; }
        pri=f.querySelector('select[data-pri]').value||pri;
      }
      var remind=persist?'':f.querySelector('select:not([data-pri])').value;
      if(!time && remind==='0') remind='';
      var newIt={id:uid(),scope:scope,sec:sec,text:text,date:persist?null:ui.date,time:time,remind:remind,pri:pri,subs:[],done:false};
      state.items.push(newIt);
      save(); render(); if(remind!==''){ askNotifyOnce(); calendarHint(newIt); }
      var nf=document.querySelector('form.add[data-scope="'+scope+'"][data-sec="'+sec+'"] input[type=text]'); if(nf) nf.focus();
      return;
    }
    if(f.id==='editForm'){
      var it=findItem(f.getAttribute('data-id')); if(!it) return;
      var d=new FormData(f);
      it.text=(d.get('text')||'').trim()||it.text;
      it.pri=d.get('pri')||'';
      var nsc=d.get('scope'), nsec=d.get('sec');
      if(nsc && nsec && secDef(nsc,nsec) && (nsc!==it.scope || nsec!==it.sec)){
        var wasP=isPersist(it); it.scope=nsc; it.sec=nsec;
        if(isPersist(it)){ it.date=null; it.time=''; it.remind=''; }
        else if(wasP){ it.date=ui.date; }
      }
      var old=it.subs||[];
      it.subs=(d.get('subs')||'').split('\n').map(function(x){return x.trim();}).filter(Boolean).map(function(txt){
        var m=old.filter(function(o){return o.text===txt;})[0];
        return m||{id:uid(),text:txt,done:false};
      });
      if(d.has('date') && !isPersist(it)){
        it.date=d.get('date')||it.date||ui.date; it.time=d.get('time')||''; it.remind=d.get('remind');
        var rep=d.get('repeat');
        if(it.rid){
          var r=state.recurring.filter(function(x){return x.id===it.rid;})[0];
          if(r && !rep) state.recurring=state.recurring.filter(function(x){return x.id!==it.rid;});
          else if(r){ r.repeat=rep; r.text=it.text; r.time=it.time; r.remind=it.remind; r.pri=it.pri; r.subs=it.subs.map(function(x){return x.text;}); }
        } else if(rep){
          var rid=uid();
          state.recurring.push({id:rid,scope:it.scope,sec:it.sec,text:it.text,time:it.time,remind:it.remind,pri:it.pri,subs:it.subs.map(function(x){return x.text;}),repeat:rep,start:it.date});
          it.rid=rid;
        }
        if(!it.rid && it.date>=todayStr()) it.handled=false;
      }
      save(); closeModal(); render(); return;
    }
    if(f.id==='carryForm'){
      var ids=new FormData(f).getAll('c'), t=todayStr();
      overdue().forEach(function(i){
        if(ids.indexOf(i.id)>=0){
          i.date=t;
          if(i.time){ var tp=i.time.split(':'), due=new Date(); due.setHours(+tp[0],+tp[1],0,0); if(due<new Date()) i.remind=''; }
        } else { i.handled=true; }
      });
      save(); closeModal(); ui.date=t; ui.followToday=true; render(); toast(ids.length?'Carried to today':'Left behind'); return;
    }
    if(f.id==='legacyForm'){
      var lf=new FormData(f), chosen=lf.getAll('day'), wantTop=lf.has('top'), wantTrim=lf.has('trim') && !legacyOverride;
      var all=Object.keys(legacyInfo.by), dropped=all.filter(function(x){return chosen.indexOf(x)<0;});
      if(!chosen.length && !wantTop){ toast('Tick at least one day'); return; }
      if(wantTrim && dropped.length && !confirm('Permanently delete '+dropped.length+' unticked day'+(dropped.length===1?'':'s')+' from the old Daybook data on this device? This cannot be undone.')) return;
      var res=importLegacy({days:chosen,top:wantTop}), removed=0;
      if(wantTrim && dropped.length){ removed=trimLegacy(chosen); }
      legacyInfo=computeLegacy(); closeModal(); render();
      toast('Brought in '+res.added+' item'+(res.added===1?'':'s')+(wantTrim&&dropped.length?' · deleted '+dropped.length+' older day'+(dropped.length===1?'':'s'):'')); return;
    }
    if(f.id==='qaForm'){
      var q=new FormData(f), raw=(q.get('text')||'').trim(); if(!raw){ f.querySelector('input[name=text]').focus(); return; }
      var sc=q.get('scope'), sec=q.get('sec'), sd=secDef(sc,sec), text=raw, pri=q.get('pri')||'', time='', date=null, remind='';
      var bg=text.match(/\s*(!{1,2})\s*$/); if(bg){ pri=pri||(bg[1].length>1?'high':'med'); text=text.slice(0,bg.index).trim()||text; }
      if(!sd.persist){
        date=q.get('date')||ui.date; time=q.get('time')||''; remind=q.get('remind')||'';
        if(!time){ var xt=extractTime(text); text=xt.text||text; time=xt.time; }
      }
      if(!time && remind==='0') remind='';
      var qaIt={id:uid(),scope:sc,sec:sec,text:text,date:date,time:time,remind:remind,pri:pri,subs:[],done:false};
      state.items.push(qaIt);
      save(); closeModal(); render(); if(remind!==''){ askNotifyOnce(); calendarHint(qaIt); }
      toast('Added to '+SCOPE_LABEL[sc]+(date&&date!==ui.date?' on '+shortDate(date):'')); return;
    }
    if(f.id==='plansForm'){
      var fd=new FormData(f);
      ['W1','W2','W3'].forEach(function(k){
        state.plans[k]={name:(fd.get('n'+k)||'').trim()||k, ex:(fd.get('e'+k)||'').split('\n').map(function(s){return s.trim();}).filter(Boolean)};
      });
      save(); closeModal(); render(); return;
    }
  });

  // ---------- daily refresh ----------
  var lastToday=todayStr(), lastDue=eveningDue();
  function tick(){
    var t=todayStr();
    if(t!==lastToday){
      lastToday=t;
      if(ui.followToday) ui.date=t;
      snapshotToday(); render();
    }
    var due=eveningDue();
    if(due!==lastDue){
      lastDue=due; render();
      if(due){
        toast('🌙 Time to plan tomorrow');
        showNotice('Time to plan tomorrow');
      }
    }
    checkReminders();
    // Keep "Overdue" chips and the clock-based banners fresh, but never while you are typing.
    var m=new Date().getMinutes();
    if(m!==lastMinute){
      lastMinute=m;
      var ae=document.activeElement, typing=ae&&/^(input|textarea|select)$/i.test(ae.tagName);
      if(!typing && !document.getElementById('modalRoot').firstChild && !document.hidden) render();
    }
  }
  var lastMinute=new Date().getMinutes();
  setInterval(tick,20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ tick(); syncIfConnected(); } });

  // ---------- boot ----------
  applyTheme();
  snapshotToday();
  render();
  tick();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  if(loadProblem) toast('Saved data could not be read. A copy was kept. See Settings → snapshots.');
  setSync(state.drive&&state.drive.connected?'auth':'off');
  syncIfConnected();
  setInterval(function(){ if(!document.hidden && tokenValid()) syncIfConnected(); },60000);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
